<body class="page-lieux">

    <!-- ==== Navigation ==== -->
    <nav class="site-nav" id="siteNav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Cours Ju — Plaine</a>
            <button class="nav-burger" id="navBurger" aria-label="Menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li><a href="lieux.html" class="nav-link active">Lieux</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- H1 visuellement caché (accessibilité + SEO) -->
    <h1 class="visually-hidden">Les lieux du quartier Cours Julien et La Plaine à Marseille</h1>

    <div class="lieux-main-layout container">
        <aside class="lieux-sidebar">
            <!-- ==== Barre d'outils : toggle + filtres ==== -->
            <header class="lieux-toolbar">
                <div class="view-toggle" role="tablist" aria-label="Choisir la vue">
                    <button id="viewListBtn" class="view-btn active" role="tab" aria-selected="true">
                        <span class="view-icon">🗂️</span>
                        <span>Liste</span>
                    </button>
                    <button id="viewMapBtn" class="view-btn" role="tab" aria-selected="false">
                        <span class="view-icon">🗺️</span>
                        <span>Carte</span>
                    </button>
                </div>

                <div class="filters-wrap">
                    <div class="filters" id="filters">
                        <button class="filter-btn active" data-category="all">
                            <span class="filter-icon">🗺️</span>
                            <span class="filter-label">Tout</span>
                        </button>
                    </div>
                </div>
            </header>
        </aside>

        <main class="lieux-content">
            <!-- ==== Vue LISTE ==== -->
            <section class="view-list" id="viewList">
                <p id="listCount" class="list-count"></p>
                <div id="cardsGrid" class="cards-grid"></div>
                <div id="listEmpty" class="list-empty" hidden>
                    Aucun lieu ne correspond à ce filtre.
                </div>
            </section>

            <!-- ==== Vue CARTE ==== -->
            <section class="view-map" id="viewMap" hidden>
                <div id="map"></div>
            </section>
        </main>
    </div>

    <!-- ==== Lightbox ==== -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-overlay" onclick="closeLightbox()"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <img src="" alt="" id="lightboxImage">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <!-- ==== Footer ==== -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>
                    &copy; 2025 Cours Ju — Plaine. Fait avec ❤️ à Marseille.
                    <a href="admin.html" class="footer-admin" title="Administration" aria-label="Administration">🔒</a>
                </p>
            </div>
        </div>
    </footer>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gesture-handling"></script>

    <!-- Custom JS -->
    <script type="module" src="lieux.js"></script>
</body>

</html>
