<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cours Ju - Plaine</title>
    <meta name="description" content="Contactez-nous au sujet du quartier Cours Julien - La Plaine à Marseille.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YW9E56RSRF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-YW9E56RSRF');
    </script>
</head>

<body class="page-contact">

    <!-- ==== Navigation ==== -->
    <nav class="site-nav" id="siteNav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Cours Ju — Plaine</a>
            <button class="nav-burger" id="navBurger" aria-label="Menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li><a href="lieux.html" class="nav-link">Lieux</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- ==== Contenu principal ==== -->
    <main class="contact-section">
        <div class="container contact-container">
            <h1 class="contact-title">Nous contacter</h1>
            <p class="contact-intro">
                Une question, une suggestion, un lieu à ajouter sur la carte ?
                Écris-nous, on te répondra dès que possible.
            </p>

            <form id="contactForm" class="contact-form"
                  action="https://formspree.io/f/xykyakzk"
                  method="POST">

                <div class="form-group">
                    <label for="cName">Nom</label>
                    <input type="text" id="cName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="cEmail">Email</label>
                    <input type="email" id="cEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="cSubject">Sujet</label>
                    <input type="text" id="cSubject" name="subject">
                </div>

                <div class="form-group">
                    <label for="cMessage">Message</label>
                    <textarea id="cMessage" name="message" rows="6" required></textarea>
                </div>

                <!-- Honeypot anti-spam (champ invisible, doit rester vide) -->
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

                <button type="submit" class="contact-submit">Envoyer</button>

                <p id="contactStatus" class="contact-status" hidden></p>
            </form>
        </div>
    </main>

    <!-- ==== Footer ==== -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>
                    &copy; 2025 Cours Ju — Plaine. Fait avec ❤️ à Marseille.
                    <a href="admin.html" class="footer-admin" title="Administration" aria-label="Administration">🔒</a>
                </p>
            </div>
        </div>
    </footer>

    <script type="module" src="contact.js"></script>
</body>

</html>
